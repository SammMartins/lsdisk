
name: Publish lsdisk to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish"
        required: true
        default: "v0.1.3"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          release_version="${RELEASE_TAG#v}"
          if [[ -z "$RELEASE_TAG" || "$project_version" != "$release_version" ]]; then
            echo "Project version and release tag do not match." >&2
            echo "Project version: $project_version" >&2
            echo "Release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "PROJECT_VERSION=$project_version" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Install test dependencies
        run: |
          python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build package
        run: python -m build

      - name: Inspect package artifacts
        run: |
          python - <<'PY'
          from email.parser import Parser
          from pathlib import Path
          import tarfile
          import zipfile

          expected_name = "lsdisk"
          expected_version = "${{ env.PROJECT_VERSION }}"
          artifacts = Path("dist")
          wheels = list(artifacts.glob("*.whl"))
          sdists = list(artifacts.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit("Expected exactly one wheel and one source distribution.")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_paths = [
                  name for name in archive.namelist()
                  if name.endswith(".dist-info/METADATA")
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit("Wheel metadata is missing or ambiguous.")
              metadata = Parser().parsestr(
                  archive.read(metadata_paths[0]).decode("utf-8")
              )

          with tarfile.open(sdists[0], "r:gz") as archive:
              metadata_members = [
                  member for member in archive.getmembers()
                  if member.name.endswith("/PKG-INFO")
              ]
              if len(metadata_members) != 1:
                  raise SystemExit("Source distribution metadata is missing or ambiguous.")
              extracted = archive.extractfile(metadata_members[0])
              if extracted is None:
                  raise SystemExit("Source distribution metadata could not be read.")
              sdist_metadata = Parser().parsestr(
                  extracted.read().decode("utf-8")
              )

          for package_metadata in (metadata, sdist_metadata):
              if (
                  package_metadata["Name"] != expected_name
                  or package_metadata["Version"] != expected_version
              ):
                  raise SystemExit("Built artifact metadata does not match the release.")
          PY

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

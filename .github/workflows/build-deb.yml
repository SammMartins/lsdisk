name: Build Debian package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dpkg-dev python3-rich python3-venv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install .

      - name: Run tests
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: Build Debian package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bash packaging/deb/build-deb.sh

      - name: Inspect Debian package
        run: |
          dpkg-deb --info dist/lsdisk_*_all.deb
          dpkg-deb --contents dist/lsdisk_*_all.deb

      - name: Upload package to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/lsdisk_*_all.deb --clobber

      - name: Upload package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lsdisk-deb
          path: dist/lsdisk_*_all.deb
